name: Payout readiness observation contracts
on:
  pull_request:
    paths:
      - 'apps/mobile/supabase/functions/_shared/payout-readiness*'
      - 'apps/mobile/supabase/functions/db-health/**'
      - 'docs/payments/drafts/payout-readiness-observability.sql'
      - '.github/workflows/payout-readiness.yml'
  push:
    branches: [master]
    paths:
      - 'apps/mobile/supabase/functions/_shared/payout-readiness*'
      - 'apps/mobile/supabase/functions/db-health/**'
      - 'docs/payments/drafts/payout-readiness-observability.sql'
      - '.github/workflows/payout-readiness.yml'
permissions:
  contents: read
jobs:
  readiness-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: npm install --prefix "$RUNNER_TEMP/payout-tests" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14 typescript@5.9.3
      - name: PostgreSQL and actual handler contracts (synthetic data only)
        env:
          NODE_PATH: ${{ runner.temp }}/payout-tests/node_modules
        run: node --test apps/mobile/supabase/functions/_shared/payout-readiness*.test.cjs apps/mobile/supabase/functions/db-health/payout-readiness.test.cjs
      - name: Edge function static checks
        run: |
          node scripts/verify-edge-functions.mjs
          node scripts/verify-issuance-invariants.mjs
