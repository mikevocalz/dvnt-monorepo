name: Event notification sender and navigation
on:
  pull_request:
    paths:
      - 'packages/app/lib/activity/**'
      - 'packages/app/lib/api/notifications.ts'
      - 'packages/app/lib/api/bootstrap.ts'
      - 'packages/app/lib/hooks/use-activities-query.ts'
      - 'packages/app/lib/hooks/use-bootstrap-notifications.ts'
      - 'packages/app/lib/stores/activity-store.ts'
      - 'packages/app/lib/notifications/**'
      - 'packages/app/features/activity/**'
      - 'packages/app/features/routes/screens/(protected)/(tabs)/activity.tsx'
      - 'apps/mobile/supabase/functions/event-broadcast-message/**'
      - 'scripts/test-event-notification-browser.cjs'
      - 'scripts/test-activity-*.cjs'
      - '.github/workflows/event-notifications.yml'
permissions:
  contents: read
jobs:
  notification-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Sender identity, routes, and broadcast persistence
        run: NODE_PATH="$PWD/apps/web/node_modules:$PWD/node_modules" node --test packages/app/lib/activity/*.test.ts packages/app/lib/activity/*.test.cjs packages/app/lib/notifications/event-broadcast-routing.test.cjs apps/mobile/supabase/functions/event-broadcast-message/index.test.cjs
      - name: Activity refresh and read-state contracts
        run: NODE_PATH="$PWD/apps/web/node_modules:$PWD/node_modules" node --test scripts/test-activity-live-refresh.cjs scripts/test-activity-read-state.cjs scripts/test-activity-history.cjs scripts/test-activity-bootstrap.cjs
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Actual web and native row interactions
        run: NODE_PATH="$PWD/apps/web/node_modules:$PWD/node_modules" node scripts/test-event-notification-browser.cjs


  mounted-ticket-rows:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/activity-rows" --ignore-scripts --no-audit --no-fund --no-save esbuild@0.28.1 typescript@5.9.2 react@19.2.3 react-dom@19.2.3 happy-dom@20.10.3
      - name: Actual DTO and mounted web/native ticket rows
        env:
          NODE_PATH: ${{ runner.temp }}/activity-rows/node_modules
        run: node scripts/test-ticket-notification-dom.cjs
