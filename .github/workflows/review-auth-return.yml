name: Review email auth return
on:
  pull_request:
    paths:
      - 'packages/app/features/events/**'
      - 'packages/app/features/routes/screens/(protected)/events/**'
      - 'scripts/test-review-section-dom.cjs'
      - 'scripts/test-event-review-detail-dom.cjs'
      - 'packages/app/lib/auth/**'
      - 'packages/app/lib/deep-linking/**'
      - 'apps/web/src/app/(frontend)/public/events/**'
      - 'apps/web/src/app/.well-known/apple-app-site-association/**'
      - 'scripts/test-review-native-links.cjs'
      - 'packages/app/lib/auth-client.web.ts'
      - 'packages/app/features/auth/screens/**'
      - 'packages/app/components/web-app-shell.web.tsx'
      - 'packages/app/features/create/create-post.web.tsx'
      - 'apps/web/src/app/(frontend)/auth/**'
      - 'apps/web/src/app/(frontend)/feed/onboarding/**'
      - 'apps/web/src/components/profile-completion-popup.tsx'
      - 'scripts/test-review-auth-return-dom.cjs'
      - 'scripts/test-browser-live-photo-import-dom.cjs'
      - '.github/workflows/review-auth-return.yml'
permissions:
  contents: read
jobs:
  review-return:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test packages/app/lib/auth/guest-event-route.test.ts packages/app/lib/auth/return-to.test.ts packages/app/lib/auth/review-return.test.ts
      - name: Install isolated mounted fixtures
        run: npm install --prefix "$RUNNER_TEMP/review-fixtures" --ignore-scripts --no-audit --no-fund --no-save typescript@5.9.3 react@19.2.3 react-dom@19.2.3 jsdom@26.1.0 esbuild@0.25.11 happy-dom@20.10.3 zustand@5.0.14 lucide-react@1.30.0 zod@4.6.5
      - name: Real auth surfaces and required-setup handoff
        run: NODE_PATH="$RUNNER_TEMP/review-fixtures/node_modules" node scripts/test-review-auth-return-dom.cjs
      - name: Real composer preserves intent through failed and confirmed first post
        run: NODE_PATH="$RUNNER_TEMP/review-fixtures/node_modules" node scripts/test-browser-live-photo-import-dom.cjs
      - name: Native routes and browser-only email landing
        run: NODE_PATH="$RUNNER_TEMP/review-fixtures/node_modules" node scripts/test-review-native-links.cjs
      - name: Existing detail section scroll and auth handoff
        run: |
          NODE_PATH="$RUNNER_TEMP/review-fixtures/node_modules" node scripts/test-review-section-dom.cjs
          REVIEW_SECTION_TARGET=1 NODE_PATH="$RUNNER_TEMP/review-fixtures/node_modules" node scripts/test-review-auth-return-dom.cjs
          NODE_PATH="$RUNNER_TEMP/review-fixtures/node_modules" node scripts/test-event-review-detail-dom.cjs
