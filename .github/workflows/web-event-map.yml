name: Web Events map regression
on:
  pull_request:
    paths:
      - 'packages/app/features/events/events-list.web.tsx'
      - 'packages/app/features/events/ui/events-map.web.tsx'
      - 'packages/app/features/events/ui/member-map.web.tsx'
      - 'packages/ui/src/google-maps-public-config.ts'
      - 'packages/app/lib/events/event-map*'
      - 'packages/app/lib/events/event-attendee-cache.test.ts'
      - 'packages/app/lib/api/event-map*'
      - 'packages/app/lib/stores/events-screen-store.ts'
      - 'packages/app/lib/hooks/use-events.ts'
      - 'packages/app/lib/hooks/use-event-realtime.ts'
      - 'packages/app/package.json'
      - 'pnpm-lock.yaml'
      - 'apps/web/src/app/(frontend)/globals.css'
      - 'scripts/test-web-event-map-browser.cjs'
      - '.github/workflows/web-event-map.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-event-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Events map (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install isolated pinned browser dependencies
        run: >-
          npm install --prefix "$RUNNER_TEMP/event-map" --ignore-scripts --no-audit --no-fund --no-save
          esbuild@0.28.1 react@19.2.3 react-dom@19.2.3 zustand@5.0.14
          lucide-react@1.30.0 @tanstack/react-virtual@3.14.2 @tanstack/react-query@5.101.0
          playwright@1.56.1 tailwindcss@4.3.3 typescript@5.9.2
      - name: Install test browser
        run: node "$RUNNER_TEMP/event-map/node_modules/playwright/cli.js" install --with-deps ${{ matrix.browser }}
      - name: Verify coordinate and privacy admission rules
        env:
          NODE_PATH: ${{ runner.temp }}/event-map/node_modules
        run: node --test packages/app/lib/events/event-map.test.ts packages/app/lib/events/event-attendee-cache.test.ts
      - name: Exercise actual Events screen and unified map
        env:
          NODE_PATH: ${{ runner.temp }}/event-map/node_modules
          EVENT_MAP_BROWSER: ${{ matrix.browser }}
          EVENT_MAP_EVIDENCE_DIR: ${{ runner.temp }}/event-map-evidence
        run: node scripts/test-web-event-map-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: events-map-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/event-map-evidence/*.png
            ${{ runner.temp }}/event-map-evidence/results.json
          if-no-files-found: ignore
          retention-days: 7
