name: Prepare reviewed member-code tree
on:
  push:
    branches: ['fix/member-promoter-codes-20261012']
    paths: ['.github/workflows/assemble-member-promoter.yml', '.github/patches/member-promoter.patch.gz']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'mikevocalz/dvnt-monorepo' && github.ref == 'refs/heads/fix/member-promoter-codes-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reproduce tested source exactly; publish objects without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/member-promoter-codes-20261012'
          assert git('rev-parse', 'HEAD^') == '4da3c81330a4ac7a3a245e24c206b70144db54b5'
          patch = gzip.decompress(pathlib.Path('.github/patches/member-promoter.patch.gz').read_bytes())
          assert len(patch) == 46038
          assert hashlib.sha256(patch).hexdigest() == 'a014e3afa12eb9ddf061b916203b6ba9793f61053fa48736952d93d280c2ed71'
          subprocess.run(['git', 'apply', '--index', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'rm', '.github/patches/member-promoter.patch.gz', '.github/workflows/assemble-member-promoter.yml'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          expected_tree = '6d8b52ed3a78e8ce6e9bdfb46941f279255487f5'
          assert git('write-tree') == expected_tree
          # Only Git objects in this repository are written. No branch, deployment,
          # protection, secret, account or payment is changed by this temporary job.
          def post(endpoint, body):
              request = urllib.request.Request('https://api.github.com/repos/mikevocalz/dvnt-monorepo/git/' + endpoint,
                  data=json.dumps(body).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for line in git('diff', '--cached', '--name-status', 'HEAD').splitlines():
              status, name = line.split('\t', 1)
              if status == 'D':
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
              else:
                  blob = post('blobs', {'content': base64.b64encode(pathlib.Path(name).read_bytes()).decode(), 'encoding': 'base64'})
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = post('trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          assert tree['sha'] == expected_tree
          commit = post('commits', {'message': 'fix(tickets): accept promoter codes across member checkout and cart review',
              'tree': tree['sha'], 'parents': [git('rev-parse', 'HEAD')]})
          print('REVIEWED_TREE=' + tree['sha'])
          print('PREPARED_COMMIT=' + commit['sha'])
          print('No refs changed. Advance the reviewed fix branch with its expected-head lease, then run normal PR checks.')
