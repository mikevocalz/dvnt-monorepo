name: Guest free issuance capacity
on:
  pull_request:
    paths:
      # Cross-rail writers and schema changes must rerun the shared inventory
      # contract too, not just edits to the free guest endpoint.
      - 'apps/mobile/supabase/functions/**'
      - 'apps/mobile/supabase/migrations/**'
      - 'scripts/verify-guest-free-issuance.mjs'
      - '.github/workflows/guest-free-capacity.yml'
  push:
    branches: [master, main]
    paths:
      - 'apps/mobile/supabase/functions/**'
      - 'apps/mobile/supabase/migrations/**'
      - 'scripts/verify-guest-free-issuance.mjs'
      - '.github/workflows/guest-free-capacity.yml'
permissions:
  contents: read
jobs:
  atomic-guest-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated fixture dependency
        run: npm install --prefix "$RUNNER_TEMP/guest-free" --ignore-scripts --no-audit --no-fund --no-save typescript@6.0.3
      - name: Real handler contracts, paid-path compatibility and replay behavior
        env:
          NODE_PATH: ${{ runner.temp }}/guest-free/node_modules
        run: node --test apps/mobile/supabase/functions/guest-checkout/atomic-free.test.cjs apps/mobile/supabase/functions/guest-checkout/access.test.cjs apps/mobile/supabase/functions/guest-checkout/discounts.test.cjs apps/mobile/supabase/functions/guest-checkout/sale-availability.test.cjs
      # A disposable local Postgres only. No project credentials/providers,
      # no production writes and no --allow-skip fallback.
      - name: Combined free and paid migrations, cross-rail concurrency and rollback
        run: node scripts/verify-guest-free-issuance.mjs --combined-paid
