name: Guest free issuance capacity
on:
  pull_request:
    paths:
      - 'apps/mobile/supabase/functions/guest-checkout/**'
      - 'apps/mobile/supabase/migrations/*guest_free_checkout_atomic.sql'
      - 'apps/mobile/supabase/migrations/*atomic_legacy_ticket_hold.sql'
      - 'scripts/verify-guest-free-issuance.mjs'
      - '.github/workflows/guest-free-capacity.yml'
  push:
    branches: [master, main]
    paths:
      - 'apps/mobile/supabase/functions/guest-checkout/**'
      - 'apps/mobile/supabase/migrations/*guest_free_checkout_atomic.sql'
      - 'apps/mobile/supabase/migrations/*atomic_legacy_ticket_hold.sql'
      - 'scripts/verify-guest-free-issuance.mjs'
      - '.github/workflows/guest-free-capacity.yml'
permissions:
  contents: read
jobs:
  atomic-guest-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Real handler contracts, paid-path compatibility and replay behavior
        run: node --test apps/mobile/supabase/functions/guest-checkout/atomic-free.test.cjs apps/mobile/supabase/functions/guest-checkout/access.test.cjs apps/mobile/supabase/functions/guest-checkout/discounts.test.cjs
      # A disposable local Postgres only. No project credentials/providers,
      # no production writes and no --allow-skip fallback.
      - name: Real multi-connection PostgreSQL capacity and rollback regressions
        run: node scripts/verify-guest-free-issuance.mjs
