name: Feed media motion
on:
  pull_request:
    paths:
      - 'packages/app/components/feed/**'
      - 'packages/app/components/media/**'
      - 'packages/app/components/story-viewer-overlay.web.tsx'
      - 'packages/app/features/home/screen.web.tsx'
      - 'packages/app/features/post/post-detail.web.tsx'
      - 'packages/app/features/routes/screens/(protected)/post/[id].tsx'
      - 'packages/app/features/create/create-post.web.tsx'
      - 'packages/app/components/lightbox.web.tsx'
      - 'packages/app/lib/stores/lightbox-store.ts'
      - 'packages/app/lib/stores/carousel-store.ts'
      - 'packages/app/lib/hooks/use-media-picker.ts'
      - 'apps/mobile/lib/hooks/use-media-picker.ts'
      - 'packages/app/lib/posts/publish*'
      - 'packages/app/lib/media/live-photo*'
      - 'packages/app/lib/server-upload.ts'
      - 'packages/app/lib/api/posts.ts'
      - 'packages/app/features/create/*live-photo*'
      - 'apps/mobile/supabase/migrations/*post*'
      - 'apps/mobile/supabase/functions/create-post/**'
      - 'packages/app/lib/hooks/use-media-upload.ts'
      - 'scripts/test-feed-motion*'
      - 'scripts/test-live-photo*'
      - 'scripts/test-browser-live-photo*'
      - 'scripts/fixtures/live-photo-roundtrip/**'
      - 'scripts/test-native-post-carousel.cjs'
      - 'scripts/test-web-live-photo-carousel*'
      - '.github/workflows/feed-motion.yml'
permissions:
  contents: read
jobs:
  real-feed-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated media test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/feed-motion" --ignore-scripts --no-audit --no-fund --no-save esbuild@0.25.11 playwright@1.58.2 typescript@6.0.3 react@19.2.3 react-dom@19.2.3 zustand@5.0.8 happy-dom@20.0.11 lucide-react@1.30.0 @electric-sql/pglite@0.3.15 @supabase/supabase-js@2.112.2
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          node "$RUNNER_TEMP/feed-motion/node_modules/playwright/cli.js" install --with-deps chrome
      - name: Playback policy, native component lifecycle and paired upload
        env:
          NODE_PATH: ${{ runner.temp }}/feed-motion/node_modules
          REQUIRE_FEED_COMPONENT_TEST: '1'
        run: |
          node --test packages/app/components/feed/native-feed-playback.test.ts packages/app/components/feed/web-video-playback.test.ts packages/app/lib/media/live-photo-upload.test.ts packages/app/components/feed/web-post-media.test.ts
          node scripts/test-feed-motion-dom.cjs
          node scripts/test-live-photo-lifecycle.cjs
          node scripts/test-live-photo-picker.cjs
          node scripts/test-browser-live-photo-import-dom.cjs
          node scripts/test-live-photo-roundtrip.cjs
          node --test packages/app/features/create/browser-live-photo-import.test.ts
          node scripts/test-native-post-carousel.cjs
          node scripts/test-web-live-photo-carousel-dom.cjs
          node --test packages/app/lib/posts/publish-queue.test.ts
      - name: Real Chrome decoding, sound, scroll, source replacement and pause
        env:
          NODE_PATH: ${{ runner.temp }}/feed-motion/node_modules
          FEED_BROWSER_CHANNEL: chrome
        run: |
          node scripts/test-feed-motion-browser.cjs
          node scripts/test-web-live-photo-carousel-browser.cjs
          node scripts/test-live-photo-roundtrip-browser.cjs
