name: Sneaky Lynk room regressions
on:
  pull_request:
    paths:
      - 'packages/app/features/sneaky-lynk/**'
      - 'packages/app/features/video/**'
      - 'packages/app/features/routes/screens/(protected)/sneaky-lynk/**'
      - 'packages/app/features/screens/(protected)/lynk/**'
      - 'packages/app/lib/lynk/**'
      - 'packages/ui/src/video/moqPlayerHtml*'
      - 'packages/app/lib/subscription/**'
      - 'packages/app/lib/video/**'
      - 'apps/mobile/supabase/functions/video_join_room/**'
      - 'apps/mobile/supabase/functions/lynk-cohost-invite/**'
      - 'apps/mobile/supabase/functions/video_create_room/**'
      - 'apps/mobile/supabase/functions/video_end_room/**'
      - 'apps/mobile/supabase/functions/lynk-moq-token/**'
      - 'apps/mobile/supabase/functions/lynk-livestream-token/**'
      - 'apps/mobile/supabase/functions/_shared/lynk-*'
      - 'apps/mobile/supabase/functions/_shared/subscription-owner.ts'
      - 'apps/mobile/supabase/migrations/*membership_subscription_owner_reads.sql'
      - 'apps/mobile/supabase/migrations/*lynk_atomic_member_admission.sql'
      - 'scripts/test-subscription-owner-rls.cjs'
      - 'scripts/test-lynk-atomic-admission.cjs'
      - 'scripts/test-lynk-room-browser.cjs'
      - 'scripts/test-lynk-native-capture.cjs'
      - 'scripts/test-lynk-native-session.cjs'
      - 'scripts/test-lynk-web-capture-sdk.cjs'
      - 'scripts/test-lynk-web-capture-ui.cjs'
      - '.github/workflows/lynk-room-regressions.yml'
  push:
    branches: [master]
    paths:
      - 'packages/app/features/sneaky-lynk/**'
      - 'packages/app/features/video/**'
      - 'packages/app/features/screens/(protected)/lynk/**'
      - 'packages/app/lib/lynk/**'
      - 'packages/ui/src/video/moqPlayerHtml*'
      - 'packages/app/lib/subscription/**'
      - 'packages/app/lib/video/**'
      - 'apps/mobile/supabase/functions/lynk-moq-token/**'
      - 'apps/mobile/supabase/functions/lynk-livestream-token/**'
      - 'apps/mobile/supabase/functions/video_join_room/**'
      - 'apps/mobile/supabase/functions/lynk-cohost-invite/**'
      - 'apps/mobile/supabase/functions/video_create_room/**'
      - 'apps/mobile/supabase/functions/video_end_room/**'
      - 'apps/mobile/supabase/functions/_shared/subscription-owner.ts'
      - 'apps/mobile/supabase/migrations/*membership_subscription_owner_reads.sql'
      - 'apps/mobile/supabase/migrations/*lynk_atomic_member_admission.sql'
      - 'scripts/test-subscription-owner-rls.cjs'
      - 'scripts/test-lynk-atomic-admission.cjs'
      - 'scripts/test-lynk-native-capture.cjs'
      - 'scripts/test-lynk-native-session.cjs'
      - 'scripts/test-lynk-web-capture-sdk.cjs'
      - 'scripts/test-lynk-web-capture-ui.cjs'
      - '.github/workflows/lynk-room-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated fixture tools
        run: npm install --prefix "$RUNNER_TEMP/lynk-tests" --no-package-lock --no-save typescript@5.9.3 esbuild@0.25.11 jsdom@26.1.0 react@19.2.3 react-dom@19.2.3 zod@3.22.4 @electric-sql/pglite@0.3.14 zustand@5.0.14
      - name: Install isolated released MoQ SDK (separate Zod 4 peer graph)
        run: npm install --legacy-peer-deps --prefix "$RUNNER_TEMP/lynk-sdk" --no-package-lock --no-save @moq/publish@0.5.2 @moq/signals@0.2.5 @zod/mini@4.5.0 zod@4.5.0 react@19.2.3
      - name: Test multi-user chat, media, room end and subscriptions
        env:
          NODE_PATH: ${{ runner.temp }}/lynk-tests/node_modules
          LYNK_SDK_DEPS: ${{ runner.temp }}/lynk-sdk/node_modules
        run: |
          node --test packages/app/features/sneaky-lynk/publish-roles.test.ts packages/app/features/sneaky-lynk/room-entry-status.test.ts packages/app/features/sneaky-lynk/api/*.test.ts packages/app/features/sneaky-lynk/session/*.test.ts packages/app/features/sneaky-lynk/ui/*.test.ts packages/app/lib/video/*.test.ts packages/app/lib/events/event-lynk.test.ts packages/app/features/video/room-lifecycle.test.ts packages/app/features/video/stores/*.test.ts packages/app/lib/lynk/*.test.ts packages/ui/src/video/moqPlayerHtml.test.ts packages/app/lib/lynk/genesis-room-admission.fixture.ts packages/app/lib/subscription/*.test.ts apps/mobile/supabase/functions/video_create_room/subscription.test.cjs apps/mobile/supabase/functions/video_end_room/index.test.cjs apps/mobile/supabase/functions/_shared/lynk-moq-access.test.cjs apps/mobile/supabase/functions/_shared/adult-gate-personas.test.cjs
          node --test scripts/test-subscription-owner-rls.cjs scripts/test-lynk-atomic-admission.cjs
          node --test apps/mobile/supabase/functions/lynk-livestream-token/index.test.cjs
          node scripts/test-lynk-room-browser.cjs --dom
          node scripts/test-lynk-web-capture-ui.cjs
          node scripts/test-lynk-native-capture.cjs
          node scripts/test-lynk-native-session.cjs
          node scripts/test-lynk-web-capture-sdk.cjs
          node scripts/verify-lynk.mjs
