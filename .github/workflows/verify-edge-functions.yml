name: verify edge functions

# Guards the two silent-production-outage modes documented in
# scripts/verify-edge-functions.mjs: verify_jwt drift on unpinned functions,
# and the beta signup gate coming back. Static only, no secrets, no network.
# Run the --live variant manually after a deploy (see package.json).
#
# The two jobs below were added because nothing ran them. The Deno suites
# under functions/_shared are the only tests covering call capacity and the
# media-lease backoff, and no npm script or workflow executed them; the SQL
# harness is the only thing that exercises twelve concurrent joiners, which
# is the failure a two-client test cannot reach.

on:
  pull_request:
    paths:
      - "apps/mobile/supabase/**"
      - "scripts/verify-edge-functions.mjs"
      - "scripts/verify-users-lockdown.mjs"
      - "scripts/verify-content-lockdown.mjs"
      - ".github/workflows/verify-edge-functions.yml"
  push:
    # Both branch names: `master` is the repo default, `main` is what
    # release PRs merge into. Listing only master meant every push check
    # silently never ran on merged work.
    branches: [master, main]
    paths:
      - "apps/mobile/supabase/**"
      - "scripts/verify-edge-functions.mjs"
      - "scripts/verify-users-lockdown.mjs"
      - "scripts/verify-content-lockdown.mjs"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-edge-functions.mjs

  deno-shared-suites:
    # 138 Deno.test cases under apps/mobile/supabase/functions/_shared that no
    # npm script reached before. They own the capacity constants.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --node-modules-dir=auto is REQUIRED here and must stay. This job runs
      # checkout + setup-deno with no pnpm install, so there is no node_modules
      # and Deno cannot resolve npm:@types/node on its own:
      #   error: Could not find a matching package for 'npm:@types/node'
      # The flag lets Deno materialise just what it needs on the runner.
      #
      # Do NOT copy this command into a local pnpm checkout. There the flag is
      # both unnecessary (pnpm already supplies @types/node, which is why this
      # passes locally without it) and harmful, because Deno would flatten
      # pnpm's symlink layout. Locally, drop the flag.
      - run: deno test --node-modules-dir=auto --no-lock --allow-net --allow-env --allow-read apps/mobile/supabase/functions/_shared/

  call-admission-concurrency:
    # Boots a throwaway cluster from the runner's own Postgres and drives
    # twelve parallel connections through admit_call_participant and the media
    # lease. Fails loudly rather than skipping: --allow-skip is deliberately
    # NOT passed, so a runner without Postgres breaks the build instead of
    # reporting a green that proves nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/verify-call-capacity.mjs

  users-write-lockdown:
    # Boots a throwaway cluster with production's public.users grants and
    # policies, proves the hole is reproduced, applies the lockdown migration
    # and asserts anon/authenticated get 42501 on every write. No --allow-skip,
    # for the same reason as the job above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/verify-users-lockdown.mjs

  content-lockdown:
    # posts writes and video_room_members.user_id reads. Same shape as the job
    # above: proves both holes exist in a fixture copied from production,
    # applies 20261003150100 and 20261003150200, and asserts they are closed.
    # Also fails if client code writes posts/likes/comments or names
    # video_room_members.user_id. No --allow-skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/verify-content-lockdown.mjs
