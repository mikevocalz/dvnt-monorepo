name: DVNT release evidence declaration
on:
  pull_request:
    paths:
      - 'scripts/check-dvnt-prod-release-evidence.cjs'
      - 'docs/release/dvnt-prod-release-*'
      - '.github/workflows/dvnt-production-evidence.yml'
permissions:
  contents: read
jobs:
  declaration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-dvnt-prod-release-evidence.cjs --schema-only
