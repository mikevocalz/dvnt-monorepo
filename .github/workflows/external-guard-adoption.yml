name: External guard forward adoption
on:
  pull_request:
    paths:
      - 'scripts/*external-guard-adoption*'
      - 'scripts/fixtures/external-guard-adoption/**'
      - 'scripts/test-external-receipt-endpoints.cjs'
      - 'apps/mobile/supabase/functions/*external-promoter-payment*/**'
      - 'apps/mobile/supabase/functions/_shared/external-payment-session.ts'
      - 'apps/mobile/supabase/config.toml'
      - 'scripts/fixtures/settlement/**'
      - 'docs/payments/drafts/settlement-external-adoption*'
      - 'apps/mobile/supabase/migrations/*external*guard*'
      - 'docs/payments/drafts/settlement-runtime-pristine.sql'
      - 'docs/payments/drafts/payout-readiness-observability.sql'
      - '.github/workflows/external-guard-adoption.yml'
permissions:
  contents: read
jobs:
  isolated-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Isolated offline SQL test dependency
        run: npm install --prefix "$RUNNER_TEMP/adoption-tests" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14 typescript@5.9.3
      - name: Exact assembly and PGlite behavior (not native lock proof)
        env:
          NODE_PATH: ${{ runner.temp }}/adoption-tests/node_modules
        run: |
          node scripts/build-external-guard-adoption.cjs --check
          node --test --test-concurrency=1 scripts/test-external-guard-adoption.cjs scripts/test-external-receipt-endpoints.cjs
      - name: Refuse unsafe database targets before SQL
        run: python3 scripts/test-external-guard-adoption-target-safety.py
      - name: Start network-isolated disposable PostgreSQL17
        run: |
          set -euo pipefail
          docker --context default run --detach --rm --name dvnt-external-adoption-ci --network none --label com.dvnt.test-purpose=external-guard-adoption-ci --env POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          ready=false
          for attempt in $(seq 1 30); do
            if test "$(docker --context default exec dvnt-external-adoption-ci cat /proc/1/comm)" = postgres && docker --context default exec --user postgres dvnt-external-adoption-ci pg_isready -h /var/run/postgresql -d postgres; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
      - name: Native PostgreSQL17 adoption and observed blocking races
        run: |
          python3 -m py_compile scripts/test-external-guard-adoption-native.py
          python3 scripts/test-external-guard-adoption-native.py --disposable-ci-postgres
      - name: Remove only generated test container and anonymous data
        if: always()
        run: docker --context default rm --force --volumes dvnt-external-adoption-ci || true
