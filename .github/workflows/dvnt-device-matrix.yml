name: DVNT media acceptance schema
on:
  pull_request:
    paths:
      - 'scripts/check-dvnt-device-evidence.cjs'
      - 'docs/release/dvnt-media-device-acceptance*'
      - '.github/workflows/dvnt-device-matrix.yml'
permissions:
  contents: read
jobs:
  matrix-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-dvnt-device-evidence.cjs --schema-only
