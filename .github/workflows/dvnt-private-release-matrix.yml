name: DVNT private event acceptance coverage
on:
  pull_request:
    paths:
      - 'scripts/check-dvnt-private-release.cjs'
      - 'docs/release/dvnt-private-*'
      - '.github/workflows/dvnt-private-release-matrix.yml'
permissions:
  contents: read
jobs:
  evidence-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-dvnt-private-release.cjs --schema-only
