name: Event ticket widget
on:
  pull_request:
    paths:
      - 'apps/mobile/supabase/functions/**'
      - 'apps/mobile/supabase/migrations/*event_ticket_widgets*'
      - 'apps/web/src/app/tickets/**'
      - 'apps/web/src/app/(frontend)/feed/events/**'
      - 'vercel.json'
      - 'apps/web/vercel.json'
      - 'packages/app/lib/ticket-embed/**'
      - 'packages/app/components/web-app-shell.web.tsx'
      - 'packages/app/lib/auth/guest-event-route*'
      - 'packages/app/lib/tickets/guest-purchase-state*'
      - 'packages/app/lib/events/event-detail-state*'
      - 'packages/app/lib/api/tickets.ts'
      - 'packages/app/lib/api/ticket-types-read.test.ts'
      - 'scripts/test-guest-event-purchase.cjs'
      - 'scripts/test-event-purchase-layout.cjs'
      - 'packages/app/features/events/ticket-upgrade*'
      - 'scripts/test-guest-event-route-browser.cjs'
      - 'packages/app/features/events/ui/event-widget.web.tsx'
      - 'packages/app/features/events/*guest-checkout*'
      - 'packages/app/features/events/event-detail.web.tsx'
      - 'packages/app/lib/stores/guest-checkout-store.ts'
      - 'packages/app/lib/tickets/guest-checkout-quote.ts'
      - 'apps/web/src/app/(frontend)/public/events/**'
      - 'scripts/test-guest-checkout-browser.cjs'
      - 'packages/app/components/ui/event-widget*'
      - 'scripts/*event-widget*'
      - '.github/workflows/event-ticket-widget.yml'
permissions:
  contents: read
jobs:
  widget-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies with clean retry if pnpm linker cache is corrupted
        run: |
          set -euo pipefail
          if ! pnpm install --frozen-lockfile --ignore-scripts; then
            echo "::warning::Initial pnpm install failed; forcing a clean relink once."
            pnpm install --frozen-lockfile --ignore-scripts --force
          fi
      - run: node --test scripts/test-event-widget.cjs packages/app/lib/auth/guest-event-route.test.ts packages/app/lib/tickets/guest-purchase-state.test.ts packages/app/lib/events/event-detail-state.test.ts packages/app/lib/api/ticket-types-read.test.ts
      - name: Configured ticket benefits only
        run: node --test packages/app/features/events/ticket-upgrade-benefits.test.ts
      - name: Install isolated pinned DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/dvnt-guest-dom" --ignore-scripts --no-audit --no-fund --no-save jsdom@26.1.0
      - name: Actual event detail guest loading, retry and tier selection
        run: NODE_PATH="$RUNNER_TEMP/dvnt-guest-dom/node_modules:$PWD/apps/web/node_modules:$PWD/node_modules" node --test scripts/test-guest-event-purchase.cjs
      - name: Existing anonymous checkout and guest ticket delivery contracts
        run: node --test apps/mobile/supabase/functions/guest-checkout/discounts.test.cjs apps/mobile/supabase/functions/get-guest-ticket/index.test.cjs
      - name: Install Chromium for the existing guest checkout flow
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Event ticket selection and purchase responsive layout
        run: EVENT_PURCHASE_OUTPUT_DIR=event-purchase-browser NODE_PATH="$PWD/apps/web/node_modules:$PWD/node_modules" node scripts/test-event-purchase-layout.cjs
      - name: Actual guest route hydration and legacy-link recovery
        run: NODE_PATH="$PWD/apps/web/node_modules:$PWD/node_modules" node scripts/test-guest-event-route-browser.cjs
      - name: Signed-out checkout sheet and real handler with fixture Stripe
        run: NODE_PATH="$PWD/apps/web/node_modules:$PWD/node_modules" node scripts/test-guest-checkout-browser.cjs
      - name: Actual widget migration in disposable PostgreSQL
        run: |
          set -euo pipefail
          sudo systemctl start postgresql
          sudo -u postgres createdb dvnt_widget_test
          python - <<'PY' | sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d dvnt_widget_test
          from pathlib import Path
          test = Path('scripts/test-event-widget.sql').read_text()
          migration = Path('apps/mobile/supabase/migrations/20261011204000_event_ticket_widgets.sql').read_text()
          marker = r'\ir ../apps/mobile/supabase/migrations/20261011204000_event_ticket_widgets.sql'
          assert test.count(marker) == 1
          print(test.replace(marker, migration))
          PY
      - name: Render actual template using fixture event data
        run: node scripts/render-event-widget-fixture.cjs
      - name: Install browser used by existing checkout test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Cross-origin responsive browser and existing-checkout navigation
        run: python scripts/test-event-widget-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-widget-browser-evidence
          path: .widget-browser/*.png
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-purchase-layout-evidence
          path: event-purchase-browser/
          if-no-files-found: error
          retention-days: 3
