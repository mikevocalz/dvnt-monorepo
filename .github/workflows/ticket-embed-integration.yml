name: Ticket embed integration
on:
  push:
    branches: [feat/ticket-embed-live-checkout]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/app/**'
      - 'apps/mobile/supabase/**'
      - 'scripts/ticket-embed/**'
      - '.github/workflows/ticket-embed-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ticket-embed-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Existing organizer and preview contracts
        run: node --test docs/ticketing/responsive-embed.test.cjs apps/mobile/supabase/functions/manage-ticket-embed/index.test.cjs
      - name: Prepare offline browser runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium --only-shell
          tar -czf /tmp/dvnt-browser-testtools.tar.gz -C "$HOME/.cache/ms-playwright" chromium_headless_shell-1200
      - uses: actions/upload-artifact@v4
        with:
          name: ticket-embed-browser-testtools
          path: /tmp/dvnt-browser-testtools.tar.gz
          retention-days: 2
