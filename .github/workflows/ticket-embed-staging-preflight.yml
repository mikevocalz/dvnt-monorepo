name: DVNT protected cohost preview browser proof
on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options: [issue, claim]
permissions:
  contents: read
concurrency:
  group: dvnt-cohost-preview-qa-browser
  cancel-in-progress: false
jobs:
  cohost-browser:
    if: github.repository == 'mikevocalz/dvnt-monorepo' && github.ref == 'refs/heads/qa/dvnt-cohost-preview'
    environment: dvnt-cohost-preview-qa
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the pinned browser test runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise only the protected private cohost preview
        env:
          OPERATION: ${{ inputs.operation }}
          FIXTURE_EVENT: ${{ vars.COHOST_QA_EVENT_ID }}
          HOST_FIXTURE: ${{ secrets.COHOST_QA_HOST }}
          RECIPIENT_FIXTURE: ${{ secrets.COHOST_QA_RECIPIENT }}
          INVITE_FRAGMENT: ${{ secrets.COHOST_QA_LINK_FRAGMENT }}
          VERCEL_PREVIEW_KEY: ${{ secrets.TICKET_EMBED_SANDBOX_BYPASS }}
        run: python scripts/test-cohost-preview-protected.py
