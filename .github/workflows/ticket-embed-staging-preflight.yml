name: DVNT signed-in staging fulfillment proof
on:
  workflow_dispatch:
    inputs:
      fingerprint:
        required: true
        type: string
      cart:
        required: true
        type: string
      valid_until:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dvnt-member-sandbox-proof
  cancel-in-progress: false
jobs:
  exact-sandbox-member:
    if: github.repository == 'mikevocalz/dvnt-monorepo' && github.ref == 'refs/heads/qa/dvnt-member-sandbox-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Confirm one exact synthetic member payment in Stripe Sandbox
        env:
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          EXPECTED_FINGERPRINT: ${{ inputs.fingerprint }}
          EXPECTED_TEST_CART: ${{ inputs.cart }}
          VALID_UNTIL: ${{ inputs.valid_until }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, time, urllib.error, urllib.parse, urllib.request
          key = os.environ['STRIPE_TEST_KEY'].strip()
          finger = os.environ['EXPECTED_FINGERPRINT']
          cart = os.environ['EXPECTED_TEST_CART']
          deadline = int(os.environ['VALID_UNTIL'])
          assert re.fullmatch(r'(?:sk|rk)_test_[a-zA-Z0-9]+', key), 'Missing sandbox-only secret'
          assert re.fullmatch(r'[0-9a-f]{64}', finger)
          assert re.fullmatch(r'[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}', cart)
          assert 10 < deadline - int(time.time()) <= 900, 'Exact staging hold too old'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def stripe(path, data=None):
              assert path.startswith('/payment_intents')
              headers = {'Authorization': 'Bearer ' + key}
              if data is not None:
                  headers['Idempotency-Key'] = 'dvnt-member-staging-' + cart
                  headers['Content-Type'] = 'application/x-www-form-urlencoded'
                  data = urllib.parse.urlencode(data).encode()
              req = urllib.request.Request('https://api.stripe.com/v1' + path, data=data, headers=headers)
              try:
                  with opener.open(req, timeout=12) as result:
                      return json.load(result)
              except urllib.error.HTTPError as e:
                  try:
                      err = json.load(e)['error']
                      code = str(err.get('code') or err.get('type') or 'unknown')
                      print('Stripe API:', e.code, code if re.fullmatch(r'[a-z0-9_]{1,70}', code) else 'unknown')
                  except Exception:
                      print('Stripe API:', e.code)
                  raise SystemExit(2)
          params = urllib.parse.urlencode({'limit': 100,'created[gte]': int(time.time())-1200})
          match = [v for v in stripe('/payment_intents?' + params)['data'] if hashlib.sha256(v['id'].encode()).hexdigest() == finger]
          assert len(match) == 1, 'Exact Stripe test PaymentIntent not found'
          v = match[0]
          m = v['metadata']
          assert v['livemode'] is False and v['amount'] == 613 and v['currency'] == 'usd'
          assert m.get('cart_id') == cart and m.get('event_id') == '2' and m.get('type') == 'cart_checkout'
          if v['status'] == 'succeeded':
              print('Exact sandbox payment already succeeded; no second confirmation')
              raise SystemExit(0)
          assert v['status'] == 'requires_payment_method' and not v.get('payment_method')
          assert time.time() < deadline - 5, 'Hold expires too soon'
          assert re.fullmatch(r'pi_[A-Za-z0-9]+', v['id'])
          paid = stripe('/payment_intents/' + v['id'] + '/confirm', {
              'payment_method': 'pm_card_visa',
              'return_url': 'https://dvnt-blog-h8kraebmu-mikefacesnys-projects.vercel.app/feed/checkout/success',
          })
          assert paid['id'] == v['id'] and paid['livemode'] is False and paid['amount'] == 613
          print('Exact Stripe sandbox confirmation:', paid['status'])
          assert paid['status'] == 'succeeded'
          PY
