name: DVNT read-only isolated payout sandbox preflight
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify-payout-sandbox:
    if: github.repository == 'mikevocalz/dvnt-monorepo' && github.ref == 'refs/heads/qa/dvnt-payout-sandbox-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read only; never contact live Stripe or transfer funds
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          node - <<'NODE'
          'use strict';
          // Read-only preflight for this exact dedicated sandbox. Does not use CLI
          // profile fallback, send a transfer, access production, or print credentials.
          const k=process.env.STRIPE_TEST_SECRET_KEY;
          const platform='acct_1UGumFCqSKa9QmBo';
          const historicalOrganizer='acct_1UHSj8CYFZsttMGi';
          const separateRecipient=process.env.DVNT_SYNTHETIC_PROMOTER_ACCOUNT;
          const assert=require('node:assert/strict');
          assert.match(k??'',/^(?:sk|rk|rkcs)_test_[A-Za-z0-9]+$/);
          async function get(path){
           const r=await fetch(new URL(path,'https://api.stripe.com'),{method:'GET',redirect:'error',
            headers:{Authorization:'Bearer '+k,'Stripe-Version':'2026-09-30.endive'},signal:AbortSignal.timeout(12000)});
           if(!r.ok)throw Error('Stripe test preflight GET refused ('+r.status+')');
           return r.json();
          }
          (async()=>{
           const account=await get('/v1/account');
           console.log("payout preflight: exact platform",account.id===platform);
           assert.equal(account.id,platform,'Dedicated sandbox identity does not match; no subsequent request');
           const bal=await get('/v1/balance');
           console.log("payout preflight: test mode",bal.livemode===false);
           assert.equal(bal.livemode,false);
           const hooks=await get('/v1/webhook_endpoints?limit=100');
           console.log("payout preflight: zero webhooks",hooks.has_more===false&&Array.isArray(hooks.data)&&hooks.data.length===0);
           assert(hooks.has_more===false&&Array.isArray(hooks.data)&&hooks.data.length===0,'Not an isolated webhook configuration');
           const existing=await get('/v1/accounts/'+historicalOrganizer);
           assert.equal(existing.id,historicalOrganizer);
           console.log("payout preflight: fixture transfers active",existing.capabilities?.transfers==="active");
           assert.equal(existing.capabilities?.transfers,'active');
           const bucket=bal.available?.find(x=>x.currency==='usd')?.source_types?.bank_account??null;
           const verdict={exactSandbox:true,testMode:true,noWebhooks:true,previousFixtureVerified:true,
             permittedBankBucketPositive:Number.isSafeInteger(bucket)&&bucket>0,
             independentlyBoundSyntheticPromoterReady:false,transferAuthorizedByThisTest:false};
           if(separateRecipient){
            assert.match(separateRecipient,/^acct_[A-Za-z0-9]+$/);
            assert.notEqual(separateRecipient,platform);
            assert.notEqual(separateRecipient,historicalOrganizer);
            const a=await get('/v2/core/accounts/'+separateRecipient+'?include%5B0%5D=configuration.recipient');
            assert.equal(a.livemode,false);
            assert.equal(a.id,separateRecipient);
            assert.equal(a.metadata?.dvnt_fixture_role,'synthetic_promoter','Fixture consent/identity not verified');
            verdict.independentlyBoundSyntheticPromoterReady=a.configuration?.recipient?.capabilities?.stripe_balance?.stripe_transfers?.status==='active';
           }
           console.log(JSON.stringify(verdict));
          })().catch(e=>{console.error(e.code==='ERR_ASSERTION'?'Exact dedicated sandbox fixture preflight failed.':e.message);process.exitCode=1;});
          NODE
