name: External receipt preflight checklist
on:
  pull_request:
    paths:
      - 'scripts/check-external-receipt-preflight.cjs'
      - 'scripts/test-external-receipt-preflight.cjs'
      - 'docs/payments/external-receipt-reconciliation-preflight.md'
      - '.github/workflows/external-receipt-preflight.yml'
permissions:
  contents: read
jobs:
  offline-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-external-receipt-preflight.cjs
