name: Guest comment boundary
on:
  pull_request:
    paths:
      - 'apps/mobile/supabase/migrations/**'
      - 'scripts/test-guest-comment-boundary.cjs'
      - 'scripts/fixtures/guest-comment-boundary.sql'
      - '.github/workflows/guest-comment-boundary.yml'
  push:
    branches: [master]
    paths:
      - 'apps/mobile/supabase/migrations/**'
      - 'scripts/test-guest-comment-boundary.cjs'
      - 'scripts/fixtures/guest-comment-boundary.sql'
      - '.github/workflows/guest-comment-boundary.yml'
permissions:
  contents: read
jobs:
  anonymous-comment-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Actual migration and role matrix in disposable PostgreSQL
        run: |
          set -euo pipefail
          sudo systemctl start postgresql
          sudo -u postgres createdb dvnt_guest_comment_test
          node scripts/test-guest-comment-boundary.cjs --sql | sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d dvnt_guest_comment_test
