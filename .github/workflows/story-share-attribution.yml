name: Story share attribution
on:
  pull_request:
    paths:
      - "apps/mobile/supabase/functions/create-story/**"
      - "apps/mobile/supabase/functions/send-message/**"
      - "apps/mobile/supabase/functions/delete-story/**"
      - "apps/mobile/supabase/functions/_shared/story-share*"
      - "apps/mobile/supabase/migrations/*story_share_attribution.sql"
      - "packages/app/components/chat/story-share-bubble.web.tsx"
      - "packages/app/components/story-viewer*"
      - "packages/app/components/story-shared-source.web.tsx"
      - "packages/app/features/story/**"
      - "packages/app/features/events/event-detail.web.tsx"
      - "packages/app/features/events/ui/share-event-to-story.web.tsx"
      - "packages/app/features/home/screen.web.tsx"
      - "packages/app/features/messages/chat.web.tsx"
      - "packages/app/lib/api/stories.ts"
      - "packages/app/lib/api/messages-impl.ts"
      - "packages/app/lib/hooks/use-stories.ts"
      - "packages/app/lib/hooks/use-share-post-to-story.ts"
      - "packages/app/lib/hooks/use-shared-story-playback.ts"
      - "packages/app/lib/messages/story-share*"
      - "packages/app/lib/stories/**"
      - "packages/app/lib/stores/chat-store.ts"
      - "packages/app/lib/stores/story-viewer-store.ts"
      - "packages/app/lib/types/index.ts"
      - "scripts/test-story-share-*"
      - "scripts/test-story-reply-identity.cjs"
      - "scripts/story-share-attribution-fixture.cjs"
      - "scripts/fixtures/story-share/**"
      - "scripts/test-post-social-actions.cjs"
      - "scripts/test-post-share-identity.cjs"
      - ".github/workflows/story-share-attribution.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  share-security-and-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated fixtures
        run: npm install --prefix "$RUNNER_TEMP/story" --ignore-scripts --no-audit --no-fund --no-save @electric-sql/pglite@0.3.14 esbuild@0.25.11 typescript@6.0.3 react@19.2.3 react-dom@19.2.3 zustand@5.0.8 happy-dom@20.0.11 jsdom@26.1.0 lucide-react@1.30.0 @tanstack/react-query@5.90.5 react-native-web@0.21.2 playwright@1.58.2 react-insta-stories@2.8.0 tailwindcss@4.3.3 postcss@8.5.26 @tailwindcss/postcss@4.3.0
      - name: Install Chromium
        run: node "$RUNNER_TEMP/story/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Transaction, privacy and identity contracts
        env:
          NODE_PATH: ${{ runner.temp }}/story/node_modules
        run: |
          node --test scripts/test-story-share-sql.mjs apps/mobile/supabase/functions/create-story/story-share.test.cjs packages/app/lib/messages/story-share.test.ts packages/app/lib/stories/share-operation.test.ts
          node scripts/test-post-social-actions.cjs
          node scripts/test-post-share-identity.cjs
          node scripts/test-story-share-message-dom.cjs
          node scripts/test-story-share-attribution-dom.cjs
          node scripts/test-story-reply-identity.cjs
      - name: Responsive story playback and tappable attribution
        env:
          NODE_PATH: ${{ runner.temp }}/story/node_modules
          STORY_SHARE_SCREENSHOT_DIR: ${{ runner.temp }}/story-attribution-screenshots
        run: node scripts/test-story-share-attribution-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-attribution-browser
          path: ${{ runner.temp }}/story-attribution-screenshots
          if-no-files-found: ignore
          retention-days: 7
