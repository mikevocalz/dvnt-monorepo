name: Web comment deletion
on:
  pull_request:
    paths:
      - 'packages/app/features/comments/**'
      - 'packages/app/lib/comments/**'
      - 'packages/app/lib/hooks/use-delete-comment.ts'
      - 'packages/app/lib/api/comments.ts'
      - 'scripts/test-comment-deletion-browser.cjs'
      - '.github/workflows/comment-deletion.yml'
permissions:
  contents: read
jobs:
  comment-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/comment-tests" --no-package-lock --no-save esbuild@0.28.2 react@19.2.3 react-dom@19.2.3 @tanstack/react-query@5.104.2 zustand@5.0.15 playwright@1.64.1
          "$RUNNER_TEMP/comment-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test deletion and ownership controls without live data
        env:
          NODE_PATH: ${{ runner.temp }}/comment-tests/node_modules
        run: |
          node --test packages/app/lib/comments/deletion.test.ts
          node scripts/test-comment-deletion-browser.cjs
