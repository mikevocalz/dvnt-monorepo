name: Promoter payout incident preflight
on:
  pull_request:
    paths:
      - 'scripts/payments/promoter-preflight.mjs'
      - 'scripts/test-promoter-preflight.mjs'
      - 'docs/runbooks/payouts-release.md'
      - '.github/workflows/promoter-preflight.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/test-promoter-preflight.mjs
