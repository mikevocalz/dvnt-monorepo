name: Blog author profiles
on:
  pull_request:
    paths:
      - 'packages/cms/src/authors/**'
      - 'packages/cms/src/collections/Authors.ts'
      - 'packages/cms/src/collections/Posts.ts'
      - 'packages/cms/src/collections/AdminUsers.ts'
      - 'packages/cms/src/collections/Media.ts'
      - 'packages/cms/src/components/**'
      - 'packages/cms/src/access/**'
      - 'packages/cms/src/posts/**'
      - 'packages/cms/src/payload.config.ts'
      - 'apps/web/src/app/(payload)/**'
      - 'scripts/test-author-profiles-integration.cjs'
      - 'scripts/test-author-profile-ui.cjs'
      - 'scripts/test-blog-author-render.cjs'
      - 'apps/web/src/lib/posts.ts'
      - 'apps/web/src/app/(frontend)/posts/**'
      - 'scripts/fixtures/author-profiles/**'
      - '.github/workflows/blog-author-profiles.yml'
permissions:
  contents: read
jobs:
  real-author-profile-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dvnt_author_fixture
          POSTGRES_PASSWORD: disposable-runner-fixture-only
          POSTGRES_DB: dvnt_author_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dvnt_author_fixture -d dvnt_author_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned fixture dependencies
        run: |
          if ! pnpm install --frozen-lockfile --ignore-scripts; then
            rm -rf node_modules
            pnpm install --frozen-lockfile --ignore-scripts --force
          fi
      - name: Real Payload authentication, profile ownership and transaction races
        env:
          DVNT_AUTHOR_TEST_DATABASE_URL: postgresql://dvnt_author_fixture:disposable-runner-fixture-only@127.0.0.1:5432/dvnt_author_fixture
        run: NODE_PATH="$PWD/apps/web/node_modules:$PWD/node_modules" node scripts/test-author-profiles-integration.cjs
      - name: Typecheck author contracts and controls
        run: >-
          pnpm exec tsc --noEmit --target ESNext --module ESNext --moduleResolution bundler
          --lib ESNext,DOM --jsx react-jsx --strict --esModuleInterop --skipLibCheck
          --allowImportingTsExtensions packages/cms/src/authors/*.test.ts
          packages/cms/src/components/AuthorProfileLink.tsx packages/cms/src/components/PostAuthorProfile.tsx
      - name: Author identity contracts
        run: node --import tsx --test packages/cms/src/authors/*.test.ts
      - name: Public author and contributor rendering
        run: NODE_PATH="$PWD/apps/web/node_modules:$PWD/node_modules" node scripts/test-blog-author-render.cjs
      - name: Install browser fixture engines
        run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - name: Author controls browser coverage
        env:
          AUTHOR_PROFILE_OUTPUT_DIR: author-profile-evidence
        run: NODE_PATH="$PWD/apps/web/node_modules:$PWD/node_modules" node scripts/test-author-profile-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: author-profile-ui-evidence
          path: author-profile-evidence
          retention-days: 7
