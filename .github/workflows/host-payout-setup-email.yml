name: Host payout setup email contract
on:
  pull_request:
    paths:
      - 'apps/mobile/supabase/functions/_shared/host-payout-setup-email.ts'
      - 'apps/mobile/supabase/functions/host-payout-setup-email/**'
      - 'apps/mobile/supabase/migrations/20261124162500_host_payout_setup_email.sql'
      - 'apps/mobile/supabase/config.toml'
      - '.github/workflows/host-payout-setup-email.yml'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/host-setup-email" --no-package-lock --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - run: NODE_PATH="$RUNNER_TEMP/host-setup-email/node_modules" node --test apps/mobile/supabase/functions/host-payout-setup-email/*.test.*
