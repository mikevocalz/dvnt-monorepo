name: Ticket embed commerce
on:
  pull_request:
    paths:
      - "apps/mobile/supabase/**"
      - "apps/web/**"
      - "packages/app/**"
      - "scripts/*ticket-embed*"
      - "scripts/ticket_embed_sandbox*.py"
      - "packages/ui/**"
      - "packages/config/**"
      - "supabase/**"
      - "docs/ticketing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "vercel.json"
      - ".npmrc"
      - ".github/workflows/ticket-embed-commerce.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ticket-embed-commerce-${{ github.ref }}
  cancel-in-progress: true
jobs:
  purchase-scope:
    name: Determine whether real sandbox purchase is needed
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recipient safety and purchase scope regressions
        run: |
          python scripts/test-ticket-embed-sandbox-helpers.py
          python scripts/test-ticket-embed-sandbox-scope.py
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          required=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            required=$(python scripts/ticket_embed_sandbox_scope.py "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [ "$required" = "false" ]; then
            echo "No checkout or shared commerce dependency changed. Contract/browser tests still run; no sandbox purchase or email." >> "$GITHUB_STEP_SUMMARY"
          fi
  contracts-and-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publication and payment runtime configuration agreement
        run: node --test apps/mobile/supabase/functions/_shared/ticket-embed-runtime.test.cjs
      - run: node --test apps/mobile/supabase/functions/ticket-embed/index.test.cjs apps/mobile/supabase/functions/manage-ticket-embed/index.test.cjs docs/ticketing/responsive-embed.test.cjs
      - run: node --test apps/mobile/supabase/functions/_shared/session-issuance.test.cjs
      - name: Real disposable PostgreSQL inventory and transaction tests
        run: node scripts/verify-ticket-embed.mjs
  browser-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: External host, iframe, recovery and payment-component contract (mock Stripe)
        run: python scripts/test-ticket-embed-browser.py
  sandbox-release:
    name: Real sandbox purchase (required before release)
    runs-on: ubuntu-latest
    needs: [purchase-scope, contracts-and-inventory, browser-contract]
    if: needs.purchase-scope.outputs.required == 'true'
    # All PRs use one disposable event; never run its purchase jobs concurrently.
    concurrency:
      group: ticket-embed-shared-sandbox
      cancel-in-progress: false
    # When purchase is required, missing sandbox access fails rather than passing.
    env:
      TICKET_EMBED_SANDBOX_HOST_URL: ${{ vars.TICKET_EMBED_SANDBOX_HOST_URL }}
      TICKET_EMBED_SANDBOX_ID: ${{ vars.TICKET_EMBED_SANDBOX_ID }}
      # Provider delivery simulator only; never route CI tickets to a personal inbox.
      TICKET_EMBED_SANDBOX_EMAIL: delivered@resend.dev
      TICKET_EMBED_SANDBOX_BYPASS: ${{ secrets.TICKET_EMBED_SANDBOX_BYPASS }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test-ticket-embed-sandbox-helpers.py
      - name: Actual Stripe test payment, QR ticket, delivery and refund
        run: python scripts/test-ticket-embed-sandbox.py

