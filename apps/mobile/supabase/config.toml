verify_jwt = false

[functions.get-text-post-slides]
verify_jwt = false

[functions.delete-conversation]
verify_jwt = false

# A10 probes — public endpoints (no secrets served); Sentry Uptime + pg_cron
# hit them without a JWT. Pinned so a redeploy can't regress to verify_jwt=true.
[functions.db-health]
verify_jwt = false

[functions.cdn-probe]
verify_jwt = false

# Better-Auth-token functions gate internally via _shared/verify-session (the
# app sends its session token in Authorization, which is not a Supabase JWT).
# 2026-08-08 incident: a bulk redeploy reset every unlisted function to
# verify_jwt=true and the gateway 401'd all app reads (comments/tickets/
# profile). Every app-called function MUST be listed here with false.
[functions.backfill-users]
