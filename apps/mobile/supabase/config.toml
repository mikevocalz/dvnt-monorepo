# Guest commerce (Phase 5.6) — public, no-account endpoints. They're guarded by
# their own checks (OTP / HMAC grant / event-visibility + per-email caps), so a
# session JWT must NOT be required. Pin here so CLI deploys keep them public.
[functions.rsvp-verify]
verify_jwt = false

[functions.rsvp-issue-guest]
verify_jwt = false

[functions.guest-checkout]
verify_jwt = false

# Guest ticket re-request (WS-7): email-only re-delivery, no session. Own
# rate limits + uniform response inside the fn; never returns ticket data.
[functions.guest-ticket-lookup]
verify_jwt = false

# OG/share page — crawlers + anon hit it; gates visibility internally.
[functions.share-page]
verify_jwt = false

# Client color write-back — anon viewers on public events populate dominant_color
# (only-if-null, single column). See docs/color-extraction-fit.md.
[functions.set-event-color]
verify_jwt = false

