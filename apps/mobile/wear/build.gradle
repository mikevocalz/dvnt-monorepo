// DVNT Wear OS app — a SEPARATE APK, not a build variant of the phone app.
// The two ship in one Play listing and share an applicationId and signing
// identity; they share nothing else.
//
// This whole module is copied into android/wear/ by
// apps/mobile/plugins/with-wear-os.js on every `expo prebuild`, because CNG
// deletes android/ wholesale. Edit it HERE, never in android/wear/.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.dvnt.app.wear'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.dvnt.app'
        // Wear OS 3.0. Below this there is no Compose-for-Wear story worth
        // shipping, and the installed base is rounding-error small.
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '1.0'
    }

    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.15' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.06.01')

    // Wear Compose M2, deliberately. androidx.wear.compose:compose-material3 is
    // 1.7.0-alpha07 and has NO stable release — Wear OS 6 markets "Material 3
    // Expressive", which makes it read as the default, but shipping a paid
    // ticketing app on an alpha dependency is not a trade worth making.
    implementation 'androidx.wear.compose:compose-material:1.6.2'
    implementation 'androidx.wear.compose:compose-foundation:1.6.2'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'

    implementation 'androidx.wear:wear:1.4.0'
    // Opening the phone app from the wrist — the escape hatch for anything the
    // watch should not do (checkout, full profile, settings).
    implementation 'androidx.wear:wear-remote-interactions:1.2.0'
    // The Data Layer: DataClient / MessageClient / CapabilityClient.
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
}
